name: C Tests

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show project files (debug)
      run: ls -R

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc

    - name: Build tests
      run: gcc tests/test_math.c src/math.c -o test_math

    - name: Run tests
      run: ./test_math
